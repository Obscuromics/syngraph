[build-system]
requires = ["setuptools >= 75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syngraph"
version = "0.2.0a"
dependencies = [
  "numpy == 1.22.4",
  "docopt >= 0.6.2",
  "pandas >= 2.2.2",
  "networkx == 2.4",
  "ete3 >= 3.1.3",
  "more-itertools >= 10.7.0",
  "tqdm >= 4.67.1",
  "matplotlib >= 3.7.1",
  "pygraphviz >= 1.7",
  "scipy >= 1.10.1",
  "biopython",
]

requires-python = ">=3.9"
authors = [
  {name = "Alex Mackintosh", email = "alexander.mackintosh@ebc.uu.se"}
]
maintainers = [
  {name = "Alex Mackintosh", email = "alexander.mackintosh@ebc.uu.se"},
]

description = "Syngraph"
readme = "README.md"
license = {file = "LICENSE.md"}
keywords = ["syngraph"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3"
]

[project.urls]
Homepage = "https://github.com/A-J-F-Mackintosh/syngraph"

[project.scripts]
syngraph = "syngraph.interface:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
